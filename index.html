<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚌 Car Jaune 974 — Horaires Départ/Arrivée</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#0055a4; --blue-hi:#0077dd; --blue-soft:#e6f0fa;
  --yellow:#ffcc00; --yellow-soft:#fff8e0;
  --red:#e1000f; --green:#00a95f;
  --white:#fff; --g50:#f6f6f6; --g100:#eee; --g200:#e5e5e5;
  --g500:#929292; --g700:#3a3a3a; --g900:#1e1e1e;
  --mono:'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--sans);background:var(--g50);color:var(--g900);
  font-size:13px;line-height:1.5;min-height:100vh}
.band{height:6px;background:linear-gradient(to right,
  var(--blue) 0%,var(--blue) 33%,var(--yellow) 33%,var(--yellow) 66%,
  var(--red) 66%,var(--red) 100%)}
header{background:linear-gradient(135deg,var(--blue),var(--blue-hi));
  color:var(--white);padding:16px 24px;position:sticky;top:6px;z-index:100;
  box-shadow:0 4px 12px rgba(0,85,164,.25)}
h1{font-size:20px;font-weight:900;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap}
h1 .badge{background:var(--yellow);color:var(--blue);padding:3px 10px;
  border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:800}
.stats{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px}
.stats span{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:4px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 120px)}
.sidebar{background:var(--white);border-right:1px solid var(--g200);
  padding:14px 0;overflow-y:auto;max-height:calc(100vh - 120px);
  position:sticky;top:110px;align-self:start}
.sb-title{padding:0 16px 10px;font-size:10px;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--g500);font-family:var(--mono);
  font-weight:700;border-bottom:1px solid var(--g100);margin-bottom:8px}
.line-btn{display:flex;align-items:center;gap:10px;padding:10px 16px;
  cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.line-btn:hover{background:var(--blue-soft);border-left-color:var(--blue)}
.line-btn.active{background:var(--blue-soft);border-left-color:var(--blue);
  font-weight:700}
.line-code{background:var(--blue);color:var(--white);padding:3px 10px;
  border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:800;
  min-width:42px;text-align:center;flex-shrink:0}
.line-btn.active .line-code{background:var(--yellow);color:var(--blue)}
.main{padding:20px 24px;overflow-y:auto;max-height:calc(100vh - 120px)}

/* En-tête ligne */
.line-header{background:var(--white);border-radius:10px;padding:18px 20px;
  margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);
  border-left:5px solid var(--blue)}
.line-title{font-size:20px;font-weight:800;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.line-title .code{background:var(--blue);color:var(--white);
  padding:6px 16px;border-radius:6px;font-family:var(--mono);
  font-size:18px;font-weight:900}
.line-info{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);
  font-size:11px;color:var(--g700)}
.line-info span{background:var(--g50);padding:5px 12px;border-radius:4px;
  border:1px solid var(--g200)}

/* Filtres */
.filters{background:var(--white);border-radius:10px;padding:14px 20px;
  margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;
  align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.filters label{font-size:12px;color:var(--g700);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono)}
.filters select{padding:8px 14px;border:1px solid var(--g200);
  border-radius:6px;font-size:13px;background:var(--white);
  font-family:var(--sans);cursor:pointer;font-weight:600}
.filters select:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.filters .count{font-family:var(--mono);font-size:12px;color:var(--blue);
  font-weight:800;margin-left:auto;background:var(--blue-soft);
  padding:6px 14px;border-radius:6px}

/* Tableau des trajets */
.trips-table{background:var(--white);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.trips-head{display:grid;
  grid-template-columns:80px 1fr 60px 80px 80px 100px;
  padding:12px 20px;background:var(--g50);
  border-bottom:2px solid var(--g200);font-family:var(--mono);
  font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--g500);font-weight:700;gap:12px;align-items:center}
.trip-row{display:grid;
  grid-template-columns:80px 1fr 60px 80px 80px 100px;
  padding:14px 20px;border-bottom:1px solid var(--g100);
  align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.trip-row:last-child{border-bottom:none}
.trip-row:hover{background:var(--blue-soft)}
.trip-row.open{background:var(--blue-soft);border-bottom:none}

.trip-dep{font-family:var(--mono);font-size:18px;font-weight:800;
  color:var(--blue);line-height:1}
.trip-dep .lbl{font-size:9px;color:var(--g500);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;display:block;
  margin-bottom:2px;font-family:var(--sans)}
.trip-dir{font-size:13px;font-weight:600;color:var(--g900);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-dir .arrow{color:var(--blue);margin:0 6px;font-weight:800}
.trip-dur{font-family:var(--mono);font-size:12px;font-weight:700;
  color:var(--g700);text-align:center;background:var(--g50);
  padding:4px 8px;border-radius:4px}
.trip-arr{font-family:var(--mono);font-size:14px;font-weight:800;
  color:var(--green);text-align:center}
.trip-arr .lbl{font-size:9px;color:var(--g500);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;display:block;
  margin-bottom:2px;font-family:var(--sans)}
.trip-stops-count{font-family:var(--mono);font-size:11px;
  color:var(--g500);text-align:center}
.trip-day{font-family:var(--mono);font-size:10px;font-weight:700;
  text-align:center;padding:4px 8px;border-radius:4px;
  background:var(--g100);color:var(--g700)}
.trip-day.week{background:#e6f0fa;color:var(--blue)}
.trip-day.sat{background:#fff8e0;color:#8a5e00}
.trip-day.sun{background:#ffe9e9;color:var(--red)}

/* Détail déplié */
.trip-detail{grid-column:1/-1;background:var(--g50);padding:16px 20px;
  margin:0 -20px -14px;border-top:1px solid var(--g200);display:none}
.trip-row.open + .trip-detail{display:block}

.detail-title{font-size:11px;text-transform:uppercase;
  letter-spacing:1px;color:var(--g500);font-family:var(--mono);
  font-weight:700;margin-bottom:12px}
.detail-stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:8px}
.detail-stop{background:var(--white);padding:10px 12px;border-radius:6px;
  border-left:3px solid var(--blue);display:grid;
  grid-template-columns:30px 1fr 60px 60px;gap:10px;align-items:center;
  font-size:12px}
.detail-stop .n{font-family:var(--mono);font-size:10px;
  color:var(--g500);font-weight:700}
.detail-stop .s{color:var(--g900);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-stop .a{font-family:var(--mono);font-size:11px;
  color:var(--g700);text-align:right}
.detail-stop .d{font-family:var(--mono);font-size:12px;
  color:var(--blue);font-weight:800;text-align:right}

/* Loading / error */
.loading{text-align:center;padding:60px;color:var(--g500)}
.spin{width:40px;height:40px;border:3px solid var(--g200);
  border-top-color:var(--blue);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fff5f5;border:1px solid var(--red);
  border-left:4px solid var(--red);padding:20px;border-radius:6px;
  color:var(--red);margin:20px;font-size:13px}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;max-height:200px;border-right:none;
    border-bottom:1px solid var(--g200)}
  .main{max-height:none}
  .trips-head{display:none}
  .trip-row{grid-template-columns:1fr 1fr;gap:8px;padding:12px}
  .trip-dir{grid-column:1/-1;font-size:12px}
  .trip-stops-count{display:none}
}
</style>
</head>
<body>
<div class="band"></div>
<header>
  <h1>🚌 CAR JAUNE 974 <span class="badge">DÉPART → ARRIVÉE</span></h1>
  <div class="stats" id="headerStats">Chargement…</div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-title">Lignes</div>
    <div id="lineList"></div>
  </aside>
  <main class="main" id="main">
    <div class="loading"><div class="spin"></div>Chargement du réseau…</div>
  </main>
</div>

<script>
const DATA_URL = 'data/car_jaune_full.json';
const state = { data:null, lines:[], selected:null, filterDay:'all', filterDir:'all' };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function parseHM(t){
  if (!t) return null;
  const [h,m] = t.split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  return h*60 + m;
}

function formatHM(minutes){
  if (minutes == null) return '—';
  const h = Math.floor(minutes/60) % 24;
  const m = minutes % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function duration(from, to){
  const a = parseHM(from), b = parseHM(to);
  if (a == null || b == null) return null;
  let d = b - a;
  if (d < 0) d += 24*60;
  return d;
}

function formatDuration(min){
  if (min == null) return '—';
  if (min < 60) return min + ' min';
  const h = Math.floor(min/60);
  const m = min % 60;
  return m === 0 ? h + 'h' : h + 'h' + String(m).padStart(2,'0');
}

function dayClass(serviceId){
  const s = (serviceId || '').toLowerCase();
  if (s.includes('dim') || s.includes('sun') || s.includes('df')) return 'sun';
  if (s.includes('sam') || s.includes('sat')) return 'sat';
  return 'week';
}

function dayLabel(serviceId){
  const s = (serviceId || '').toLowerCase();
  if (s.includes('dim') || s.includes('sun') || s.includes('df')) return 'Dimanche';
  if (s.includes('sam') || s.includes('sat')) return 'Samedi';
  return 'Semaine';
}

function dayFilterMatch(serviceId){
  if (state.filterDay === 'all') return true;
  return dayClass(serviceId) === state.filterDay;
}

async function load(){
  const main = document.getElementById('main');
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.data = data;
    state.lines = (data.lines || []).sort((a,b)=>a.code.localeCompare(b.code,'fr',{numeric:true}));
    renderHeader();
    renderSidebar();
    if (state.lines.length) selectLine(state.lines[0].code);
  } catch(e){
    main.innerHTML = `<div class="err"><strong>❌ ${esc(e.message)}</strong><br><br>
      Lance d'abord :<br><code style="background:#fff;padding:4px 8px;
      border-radius:3px">python scripts/parse_car_jaune_full.py</code></div>`;
  }
}

function renderHeader(){
  const c = state.data.counts || {};
  document.getElementById('headerStats').innerHTML = `
    <span>📊 ${c.lines || 0} lignes</span>
    <span>📍 ${c.stops || 0} arrêts</span>
    <span>🚏 ${c.trips || 0} trajets</span>
    <span>⏱️ ${(c.stop_times || 0).toLocaleString('fr-FR')} passages</span>
  `;
}

function renderSidebar(){
  const list = document.getElementById('lineList');
  list.innerHTML = state.lines.map(l => `
    <div class="line-btn ${l.code === state.selected ? 'active' : ''}" data-code="${esc(l.code)}">
      <span class="line-code">${esc(l.code)}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;
                   white-space:nowrap;font-size:12px">${esc(l.name)}</span>
      <span style="font-family:var(--mono);font-size:10px;color:var(--g500)">${l.trips_count}</span>
    </div>
  `).join('');
  list.querySelectorAll('.line-btn').forEach(el => {
    el.addEventListener('click', () => selectLine(el.dataset.code));
  });
}

function selectLine(code){
  state.selected = code;
  state.filterDay = 'all';
  state.filterDir = 'all';
  renderSidebar();
  renderMain();
}

function renderMain(){
  const main = document.getElementById('main');
  const line = state.lines.find(l => l.code === state.selected);
  if (!line){ main.innerHTML = ''; return; }

  let trips = line.departures.filter(t =>
    dayFilterMatch(t.service_id) &&
    (state.filterDir === 'all' || t.headsign === state.filterDir)
  );

  const dirs = [...new Set(line.departures.map(d => d.headsign).filter(Boolean))].sort();

  const dirsOpts = dirs.map(d =>
    `<option value="${esc(d)}" ${state.filterDir === d ? 'selected':''}>${esc(d)}</option>`
  ).join('');

  const rows = trips.map((t, i) => {
    const stops = t.stops || [];
    const depTime = stops[0]?.dep || '';
    const arrTime = stops[stops.length-1]?.arr || '';
    const depStop = stops[0]?.stop || '';
    const arrStop = stops[stops.length-1]?.stop || '';
    const dur = duration(depTime, arrTime);
    const dClass = dayClass(t.service_id);

    const detailStops = stops.map((s, j) => `
      <div class="detail-stop">
        <span class="n">${String(j+1).padStart(2,'0')}</span>
        <span class="s" title="${esc(s.stop)}">${esc(s.stop)}</span>
        <span class="a">${esc(s.arr || '—')}</span>
        <span class="d">${esc(s.dep || '—')}</span>
      </div>
    `).join('');

    return `
      <div class="trip-row" data-idx="${i}">
        <span class="trip-dep">
          <span class="lbl">Départ</span>
          ${esc(depTime || '—')}
        </span>
        <span class="trip-dir" title="${esc(depStop)} → ${esc(arrStop)}">
          ${esc(depStop)}
          <span class="arrow">→</span>
          ${esc(arrStop)}
        </span>
        <span class="trip-dur">${formatDuration(dur)}</span>
        <span class="trip-arr">
          <span class="lbl">Arrivée</span>
          ${esc(arrTime || '—')}
        </span>
        <span class="trip-stops-count">${stops.length} arrêts</span>
        <span class="trip-day ${dClass}">${dayLabel(t.service_id)}</span>
      </div>
      <div class="trip-detail">
        <div class="detail-title">🕐 Détail des ${stops.length} arrêts · ${esc(t.headsign)}</div>
        <div class="detail-stops">${detailStops}</div>
      </div>
    `;
  }).join('');

  main.innerHTML = `
    <div class="line-header">
      <div class="line-title">
        <span class="code">${esc(line.code)}</span>
        ${esc(line.name)}
      </div>
      <div class="line-info">
        <span>🚏 ${line.trips_count} départs</span>
        <span>📍 ${line.stops_count} arrêts</span>
        <span>🧭 ${line.directions.length} directions</span>
      </div>
    </div>

    <div class="filters">
      <label>Jour :</label>
      <select id="dayFilter">
        <option value="all">Tous</option>
        <option value="week" ${state.filterDay==='week'?'selected':''}>Semaine</option>
        <option value="sat" ${state.filterDay==='sat'?'selected':''}>Samedi</option>
        <option value="sun" ${state.filterDay==='sun'?'selected':''}>Dimanche</option>
      </select>
      <label>Direction :</label>
      <select id="dirFilter">
        <option value="all">Toutes</option>
        ${dirsOpts}
      </select>
      <span class="count">${trips.length} / ${line.trips_count} départs</span>
    </div>

    <div class="trips-table">
      <div class="trips-head">
        <span>Départ</span>
        <span>Trajet</span>
        <span>Durée</span>
        <span>Arrivée</span>
        <span>Arrêts</span>
        <span>Jour</span>
      </div>
      ${rows || '<div class="loading">Aucun départ pour ces filtres</div>'}
    </div>
  `;

  document.getElementById('dayFilter').addEventListener('change', e => {
    state.filterDay = e.target.value;
    renderMain();
  });
  document.getElementById('dirFilter').addEventListener('change', e => {
    state.filterDir = e.target.value;
    renderMain();
  });

  main.querySelectorAll('.trip-row').forEach(row => {
    row.addEventListener('click', () => {
      const wasOpen = row.classList.contains('open');
      main.querySelectorAll('.trip-row').forEach(r => r.classList.remove('open'));
      if (!wasOpen) row.classList.add('open');
    });
  });
}

load();
</script>
</body>
</html>
