<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚌 Car Jaune 974 — Monitor intelligent</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#0055a4; --blue-hi:#0077dd; --blue-soft:#e6f0fa;
  --yellow:#ffcc00; --yellow-soft:#fff8e0;
  --red:#e1000f; --red-soft:#ffe9e9;
  --green:#00a95f; --green-soft:#e6f7ee;
  --orange:#e67e22; --purple:#7b5cff; --dark:#3a3a3a;
  --white:#fff; --g50:#f6f6f6; --g100:#eee; --g200:#e5e5e5;
  --g500:#929292; --g700:#3a3a3a; --g900:#1e1e1e;
  --mono:'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--sans);background:var(--g50);color:var(--g900);
  font-size:13px;line-height:1.5;min-height:100vh}
.band{height:6px;background:linear-gradient(to right,
  var(--blue) 0%,var(--blue) 33%,var(--yellow) 33%,var(--yellow) 66%,
  var(--red) 66%,var(--red) 100%)}
header{background:linear-gradient(135deg,var(--blue),var(--blue-hi));
  color:var(--white);padding:14px 24px;position:sticky;top:6px;z-index:100;
  box-shadow:0 4px 12px rgba(0,85,164,.25)}
header h1{font-size:18px;font-weight:900;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap}
header h1 .badge{background:var(--yellow);color:var(--blue);
  padding:3px 10px;border-radius:5px;font-family:var(--mono);
  font-size:11px;font-weight:800}
.stats{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px}
.stats span{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:4px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 110px)}
.sidebar{background:var(--white);border-right:1px solid var(--g200);
  padding:12px 0;overflow-y:auto;max-height:calc(100vh - 110px);
  position:sticky;top:100px;align-self:start}
.sb-title{padding:0 14px 8px;font-size:10px;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--g500);font-family:var(--mono);
  font-weight:700;border-bottom:1px solid var(--g100);margin-bottom:6px}
.sb-search{padding:6px 10px}
.sb-search input{width:100%;padding:7px 10px;border:1px solid var(--g200);
  border-radius:4px;font-size:12px;font-family:var(--sans)}
.sb-search input:focus{outline:none;border-color:var(--blue)}
.line-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;
  cursor:pointer;transition:all .1s;border-left:3px solid transparent;
  font-size:12px}
.line-btn:hover{background:var(--blue-soft);border-left-color:var(--blue)}
.line-btn.active{background:var(--blue-soft);border-left-color:var(--blue);
  font-weight:700}
.line-code{background:var(--blue);color:var(--white);padding:2px 8px;
  border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:800;
  min-width:38px;text-align:center;flex-shrink:0}
.line-btn.active .line-code{background:var(--yellow);color:var(--blue)}
.line-icon{font-size:11px;flex-shrink:0}
.line-count{font-family:var(--mono);font-size:10px;color:var(--g500);
  margin-left:auto}
.legend{background:var(--white);border-top:1px solid var(--g200);
  padding:12px 14px;margin-top:12px}
.legend-title{font-size:10px;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--g500);font-family:var(--mono);
  font-weight:700;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:8px;
  padding:5px 0;font-size:11px;color:var(--g700)}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend-dot.express{background:var(--yellow)}
.legend-dot.nord{background:var(--blue)}
.legend-dot.sud{background:var(--green)}
.legend-dot.ouest{background:var(--orange)}
.legend-dot.est{background:var(--red)}
.legend-dot.aeroport{background:var(--purple)}
.legend-dot.zoom{background:var(--dark)}
.legend-item strong{color:var(--g900);font-weight:700;
  font-family:var(--mono);font-size:10px}
.legend-item span{color:var(--g500);font-size:10px}
[data-tooltip]{position:relative;cursor:help}
[data-tooltip]:hover::after{content:attr(data-tooltip);
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--g900);color:var(--white);padding:6px 10px;
  border-radius:4px;font-size:11px;white-space:nowrap;
  font-family:var(--sans);font-weight:500;z-index:1000;
  box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:none;
  margin-bottom:6px}
.main{padding:16px 20px;overflow-y:auto;max-height:calc(100vh - 110px)}

.line-header{background:var(--white);border-radius:10px;padding:16px 20px;
  margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);
  border-left:5px solid var(--blue)}
.line-header.zone-express{border-left-color:var(--yellow)}
.line-header.zone-nord{border-left-color:var(--blue)}
.line-header.zone-sud{border-left-color:var(--green)}
.line-header.zone-ouest{border-left-color:var(--orange)}
.line-header.zone-est{border-left-color:var(--red)}
.line-header.zone-aeroport{border-left-color:var(--purple)}
.line-header.zone-zoom{border-left-color:var(--dark)}
.line-title{font-size:18px;font-weight:800;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.line-title .code{background:var(--blue);color:var(--white);
  padding:5px 14px;border-radius:6px;font-family:var(--mono);
  font-size:16px;font-weight:900}
.zone-badge{display:inline-block;padding:3px 10px;border-radius:5px;
  font-family:var(--mono);font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px}
.zone-badge.zone-express{background:var(--yellow);color:var(--blue)}
.zone-badge.zone-nord{background:var(--blue);color:var(--white)}
.zone-badge.zone-sud{background:var(--green);color:var(--white)}
.zone-badge.zone-ouest{background:var(--orange);color:var(--white)}
.zone-badge.zone-est{background:var(--red);color:var(--white)}
.zone-badge.zone-aeroport{background:var(--purple);color:var(--white)}
.zone-badge.zone-zoom{background:var(--dark);color:var(--white)}
.line-info{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);
  font-size:11px;color:var(--g700)}
.line-info span{background:var(--g50);padding:4px 10px;border-radius:4px;
  border:1px solid var(--g200)}

/* ═══ MODULE INTELLIGENT ═══ */
.smart-widget{background:linear-gradient(135deg,var(--blue),var(--blue-hi));
  color:var(--white);border-radius:12px;padding:14px 18px;
  margin-bottom:14px;box-shadow:0 4px 16px rgba(0,85,164,.25);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.smart-btn{background:rgba(255,255,255,.2);color:var(--white);
  border:1px solid rgba(255,255,255,.3);
  padding:9px 16px;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:700;font-family:var(--sans);
  display:inline-flex;align-items:center;gap:7px;
  transition:all .15s;white-space:nowrap;
  backdrop-filter:blur(4px)}
.smart-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.smart-btn.active{background:var(--green);border-color:var(--green)}
.smart-btn:disabled{opacity:.5;cursor:not-allowed}
.smart-status{font-family:var(--mono);font-size:11px;
  color:rgba(255,255,255,.85);margin-left:auto;
  background:rgba(0,0,0,.2);padding:5px 10px;border-radius:6px}

.smart-results{background:var(--white);border-radius:12px;
  padding:0;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  border-left:5px solid var(--green);overflow:hidden}
.smart-results-head{padding:14px 18px;
  background:linear-gradient(to right,var(--green-soft) 0%,var(--white) 100%);
  border-bottom:1px solid var(--g200);
  display:flex;align-items:center;gap:10px}
.smart-results-head h3{font-size:15px;color:var(--green);
  font-weight:800;display:flex;align-items:center;gap:8px;
  flex:1;margin:0}
.smart-results-head .dist{font-family:var(--mono);font-size:11px;
  color:var(--g700);background:var(--white);padding:3px 8px;
  border-radius:4px;border:1px solid var(--g200)}
.smart-results-head .close{background:transparent;border:none;
  color:var(--g500);cursor:pointer;font-size:18px;
  padding:4px 8px;border-radius:4px;transition:all .15s}
.smart-results-head .close:hover{background:var(--g100);color:var(--g900)}
.smart-results-body{padding:8px 0}

.next-car{display:grid;
  grid-template-columns:70px 1fr 100px 90px;
  gap:14px;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--g100);cursor:pointer;
  transition:all .15s}
.next-car:hover{background:var(--blue-soft);transform:translateX(2px)}
.next-car:last-child{border-bottom:none}
.next-car .code{background:var(--blue);color:var(--white);
  padding:6px 12px;border-radius:6px;font-family:var(--mono);
  font-size:14px;font-weight:800;text-align:center;
  letter-spacing:.5px}
.next-car .route{font-size:13px;font-weight:600;color:var(--g900);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-car .route small{display:block;font-size:11px;
  color:var(--g500);font-family:var(--mono);font-weight:400;
  margin-top:3px}
.next-car .time{font-family:var(--mono);font-size:18px;
  font-weight:800;color:var(--blue);text-align:right;line-height:1}
.next-car .time.soon{color:var(--green)}
.next-car .time.very-soon{color:var(--red);
  animation:pulse 1s infinite}
.next-car .wait{font-family:var(--mono);font-size:11px;
  color:var(--g500);text-align:right;font-weight:600}
.next-car .wait.very-soon{color:var(--red);font-weight:800}
.next-car .wait.soon{color:var(--green);font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.smart-extra{margin-top:8px;padding:0 18px 14px}
.smart-extra summary{cursor:pointer;font-size:12px;
  color:var(--blue);font-weight:700;padding:8px 0;
  list-style:none;user-select:none}
.smart-extra summary::-webkit-details-marker{display:none}
.smart-extra summary::before{content:'▸ ';display:inline-block;
  transition:transform .2s}
.smart-extra[open] summary::before{transform:rotate(90deg)}
.smart-extra .stop-row{padding:9px 0;border-bottom:1px solid var(--g100);
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;cursor:pointer;transition:all .15s}
.smart-extra .stop-row:hover{background:var(--blue-soft);
  margin:0 -18px;padding-left:18px;padding-right:18px}
.smart-extra .stop-row:last-child{border-bottom:none}
.smart-extra .stop-row .name{color:var(--g900);font-weight:600}
.smart-extra .stop-row .meta{color:var(--g500);font-family:var(--mono);
  font-size:11px;text-align:right}

#map{height:300px;border-radius:8px;margin-top:10px;
  box-shadow:inset 0 0 0 1px var(--g200)}
.leaflet-container{font-family:var(--sans)!important}
.leaflet-popup-content{font-size:12px;margin:8px 10px}
.leaflet-popup-content strong{color:var(--blue)}

.itinerary-form{padding:14px 18px;display:grid;
  grid-template-columns:1fr 1fr auto;gap:10px;
  background:var(--g50);border-bottom:1px solid var(--g200)}
.itinerary-form input{padding:9px 12px;border:1px solid var(--g200);
  border-radius:6px;font-size:13px;font-family:var(--sans);
  background:var(--white)}
.itinerary-form input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.itinerary-form button{background:var(--green);color:var(--white);
  border:none;padding:9px 18px;border-radius:6px;cursor:pointer;
  font-weight:700;font-size:13px;transition:all .15s}
.itinerary-form button:hover{background:#008a4c}
.itinerary-result{padding:14px 18px;font-size:13px;
  border-bottom:1px solid var(--g100);line-height:1.7}
.itinerary-result .step{display:flex;gap:10px;padding:6px 0}
.itinerary-result .step .icon{font-size:16px;flex-shrink:0}
.itinerary-result .step .txt{color:var(--g900)}
.itinerary-result .step .txt strong{color:var(--blue)}

.notif-prompt{position:fixed;bottom:20px;right:20px;
  background:var(--white);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
  border-left:4px solid var(--blue);
  padding:14px 18px;max-width:320px;z-index:9999;
  display:none;animation:slideIn .3s}
.notif-prompt.show{display:block}
.notif-prompt p{font-size:13px;color:var(--g700);margin-bottom:10px}
.notif-prompt button{background:var(--blue);color:var(--white);
  border:none;padding:7px 14px;border-radius:6px;
  cursor:pointer;font-size:12px;font-weight:700;margin-right:6px}
.notif-prompt button.secondary{background:var(--g100);color:var(--g700)}
@keyframes slideIn{from{transform:translateY(100%);opacity:0}
  to{transform:translateY(0);opacity:1}}

/* Toolbar + filtres */
.toolbar{background:var(--white);border-radius:10px;padding:12px 16px;
  margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;
  align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 34px;
  border:1px solid var(--g200);border-radius:6px;font-size:13px;
  font-family:var(--sans)}
.search-box input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;
  transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}
.toolbar select{padding:8px 10px;border:1px solid var(--g200);
  border-radius:6px;font-size:12px;background:var(--white);
  font-family:var(--sans);font-weight:600;cursor:pointer}
.toolbar select:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft)}
.toolbar .count{font-family:var(--mono);font-size:11px;color:var(--blue);
  font-weight:800;background:var(--blue-soft);padding:6px 12px;
  border-radius:6px;margin-left:auto}
.btn{background:var(--white);color:var(--g700);border:1px solid var(--g200);
  padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;
  font-weight:600;font-family:var(--sans);transition:all .15s;
  white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.btn.primary{background:var(--green);color:var(--white);border-color:var(--green)}
.btn.primary:hover{background:#008a4c;border-color:#008a4c;color:var(--white)}

/* Liste des trajets */
.trips-list{display:flex;flex-direction:column;gap:12px}
.trip-block{display:block;border:none}
.trip-block td{padding:0;border:none}
.trip-card{background:var(--white);border-radius:10px;
  border-left:4px solid var(--blue);overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.trip-head-mobile{display:grid;
  grid-template-columns:80px 1fr 80px auto;gap:12px;
  padding:14px 16px;align-items:center;
  background:linear-gradient(to right,var(--blue-soft) 0%,var(--white) 100%)}
.trip-head-mobile .trip-time{display:flex;flex-direction:column;gap:2px}
.trip-head-mobile .trip-time .lbl{font-size:9px;text-transform:uppercase;
  letter-spacing:1px;color:var(--g500);font-family:var(--mono);font-weight:700}
.trip-head-mobile .trip-time strong{font-family:var(--mono);
  font-size:18px;font-weight:800;color:var(--blue);line-height:1}
.trip-head-mobile .trip-time.arr strong{color:var(--green)}
.trip-head-mobile .trip-route{display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--g900);
  overflow:hidden;text-overflow:ellipsis}
.trip-head-mobile .trip-route .stop{overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.trip-head-mobile .trip-route .arrow{color:var(--blue);font-weight:800;flex-shrink:0}
.trip-head-mobile .trip-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.trip-meta .badge{font-family:var(--mono);font-size:10px;font-weight:700;
  padding:4px 8px;border-radius:4px;white-space:nowrap}
.trip-meta .badge.dur{background:var(--g100);color:var(--g700)}
.trip-meta .badge.day{background:var(--blue-soft);color:var(--blue)}
.trip-meta .badge.day.sat{background:var(--yellow-soft);color:#8a5e00}
.trip-meta .badge.day.sun{background:var(--red-soft);color:var(--red)}
.trip-meta .badge.stops{background:var(--g50);color:var(--g500);border:1px solid var(--g200)}
.trip-card table.stops{width:100%;border-collapse:collapse;
  font-size:12px;background:var(--white);border-top:1px solid var(--g200)}
.trip-card table.stops th{background:var(--g50);padding:8px 12px;
  text-align:left;font-family:var(--mono);font-size:10px;
  color:var(--g500);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;border-bottom:1px solid var(--g200)}
.trip-card table.stops td{padding:8px 12px;
  border-bottom:1px solid var(--g100);vertical-align:middle}
.trip-card table.stops tr:last-child td{border-bottom:none}
.trip-card table.stops .n{font-family:var(--mono);font-size:10px;
  color:var(--g500);width:36px;text-align:center;font-weight:700}
.trip-card table.stops .s{color:var(--g900);font-weight:500}
.trip-card table.stops .a{font-family:var(--mono);font-size:11px;
  color:var(--g700);text-align:right;width:70px}
.trip-card table.stops .d{font-family:var(--mono);font-size:12px;
  color:var(--blue);font-weight:800;text-align:right;width:70px}
.trip-card table.stops tr.terminus-row{background:var(--green-soft)}
.trip-card table.stops tr.terminus-row .s{font-weight:800;color:var(--green)}
.trip-card table.stops tr.depart-row{background:var(--blue-soft)}
.trip-card table.stops tr.depart-row .s{font-weight:800;color:var(--blue)}
tr.hour-separator td{background:var(--blue);color:var(--white);
  font-family:var(--mono);font-size:11px;font-weight:800;
  padding:8px 14px;letter-spacing:.5px;border-radius:6px}

.pagination{display:flex;gap:6px;align-items:center;justify-content:center;
  padding:14px;background:var(--white);margin-top:12px;border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);flex-wrap:wrap}
.pagination button{background:var(--white);border:1px solid var(--g200);
  color:var(--g700);padding:6px 12px;border-radius:4px;cursor:pointer;
  font-size:12px;font-weight:600;font-family:var(--sans);transition:all .15s}
.pagination button:hover:not(:disabled){border-color:var(--blue);
  color:var(--blue);background:var(--blue-soft)}
.pagination button:disabled{opacity:.3;cursor:not-allowed}
.pagination button.active{background:var(--blue);color:var(--white);
  border-color:var(--blue)}
.pagination .info{font-family:var(--mono);font-size:11px;
  color:var(--g700);padding:0 10px}
.pagination .size-sel{padding:6px 8px;border:1px solid var(--g200);
  border-radius:4px;font-size:11px;font-family:var(--sans)}

mark{background:var(--yellow);color:var(--g900);padding:0 2px;
  border-radius:2px;font-weight:700}
.loading{text-align:center;padding:60px;color:var(--g500)}
.spin{width:40px;height:40px;border:3px solid var(--g200);
  border-top-color:var(--blue);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fff5f5;border:1px solid var(--red);
  border-left:4px solid var(--red);padding:20px;border-radius:6px;
  color:var(--red);margin:20px;font-size:13px}
.kbd{display:inline-block;background:var(--g100);border:1px solid var(--g200);
  border-radius:3px;padding:1px 6px;font-family:var(--mono);font-size:10px;
  color:var(--g700);font-weight:700}
.hint{font-family:var(--mono);font-size:10px;color:var(--g500);
  text-align:center;padding:10px}

@media(max-width:768px){
  header{padding:12px 16px}
  header h1{font-size:15px}
  .stats{font-size:10px}
  .stats span{padding:2px 8px}
  .app{grid-template-columns:1fr;min-height:auto}
  .sidebar{position:static;max-height:none;border-right:none;
    border-bottom:1px solid var(--g200);padding:8px 0}
  .main{padding:12px;max-height:none}
  .line-header{padding:12px 14px;border-radius:8px}
  .line-title{font-size:15px;gap:8px}
  .line-title .code{padding:4px 10px;font-size:14px}
  .zone-badge{font-size:9px;padding:2px 8px}
  .line-info{font-size:10px;gap:4px}
  .line-info span{padding:3px 8px}

<body>
<div class="band"></div>
<header>
  <h1>🚌 CAR JAUNE 974 <span class="badge">HORAIRES 2025</span></h1>
  <div class="stats" id="headerStats">Chargement…</div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sb-title">Lignes</div>
    <div class="sb-search">
      <input type="text" id="lineSearch" placeholder="Filtrer les lignes…" autocomplete="off">
    </div>
    <div id="lineList"></div>
    <div class="legend">
      <div class="legend-title">📖 Signification</div>
      <div class="legend-item" data-tooltip="Lignes directes, peu d'arrêts">
        <span class="legend-dot express"></span>
        <strong>E1X, O1X, TX</strong>
        <span>Express</span>
      </div>
      <div class="legend-item" data-tooltip="Secteur Est — Saint-Benoît / Saint-André">
        <span class="legend-dot est"></span>
        <strong>E1, E2, E3</strong>
        <span>Est</span>
      </div>
      <div class="legend-item" data-tooltip="Secteur Ouest — Saint-Paul">
        <span class="legend-dot ouest"></span>
        <strong>O1, O2, O3</strong>
        <span>Ouest</span>
      </div>
      <div class="legend-item" data-tooltip="Secteur Sud — Saint-Pierre / Saint-Joseph">
        <span class="legend-dot sud"></span>
        <strong>S1, S2, S3…</strong>
        <span>Sud</span>
      </div>
      <div class="legend-item" data-tooltip="Desserte Aéroport Roland Garros">
        <span class="legend-dot aeroport"></span>
        <strong>T, TX</strong>
        <span>Aéroport</span>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <!-- ═══ MODULE INTELLIGENT ═══ -->
    <div class="smart-widget" id="smartWidget">
      <button class="smart-btn" id="btnLocate" title="Utiliser ma position">
        📍 <span>Ma position</span>
      </button>
      <button class="smart-btn" id="btnNext" title="Prochain car">
        🎯 <span>Prochain car</span>
      </button>
      <button class="smart-btn" id="btnItinerary" title="Itinéraire">
        🗺️ <span>Itinéraire</span>
      </button>
      <button class="smart-btn" id="btnMap" title="Carte">
        🗺️ <span>Carte</span>
      </button>
      <span class="smart-status" id="smartStatus">💡 Activez la géolocalisation</span>
    </div>

    <div class="smart-results" id="smartResults" style="display:none"></div>

    <!-- Notification prompt -->
    <div class="notif-prompt" id="notifPrompt">
      <p><strong>🔔 Notifications</strong><br>Voulez-vous être prévenu quand le car approche ?</p>
      <button onclick="Smart.enableNotifs()">Activer</button>
      <button class="secondary" onclick="document.getElementById('notifPrompt').classList.remove('show')">Plus tard</button>
    </div>

    <div id="mainContent">
      <div class="loading"><div class="spin"></div>Chargement du réseau…</div>
    </div>
  </main>
</div>

<script>
const DATA_URL = 'data/car_jaune_full.json';
const PAGE_SIZE_DEFAULT = 50;

const state = {
  data: null,
  lines: [],
  selected: null,
  lineSearch: '',
  search: '',
  filterDay: 'all',
  filterDir: 'all',
  filterHour: 'all',
  sortKey: 'dep',
  sortDir: 'asc',
  page: 1,
  pageSize: PAGE_SIZE_DEFAULT,
  openTrips: new Set(),
};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function highlight(text, query){
  if (!query) return esc(text);
  const t = String(text ?? '');
  const n = normalize(t);
  const q = normalize(query);
  const idx = n.indexOf(q);
  if (idx === -1) return esc(t);
  return esc(t.slice(0, idx)) + '<mark>' + esc(t.slice(idx, idx + q.length)) + '</mark>' + esc(t.slice(idx + q.length));
}
function formatHM(t){
  if (!t) return '—';
  const parts = String(t).split(':');
  if (parts.length < 2) return t;
  return parts[0].padStart(2,'0') + ':' + parts[1].padStart(2,'0');
}
function parseHM(t){ if (!t) return null; const [h,m] = t.split(':').map(Number); if (isNaN(h)||isNaN(m)) return null; return h*60+m; }
function formatDuration(min){ if (min==null) return '—'; if (min<60) return min+' min'; const h = Math.floor(min/60); const m = min%60; return m===0 ? h+'h' : h+'h'+String(m).padStart(2,'0'); }
function duration(from, to){ const a = parseHM(from), b = parseHM(to); if (a==null||b==null) return null; let d = b-a; if (d<0) d += 1440; return d; }
function dayClass(sid){ const s = (sid||'').toLowerCase(); if (s.includes('dim')||s.includes('sun')||s.includes('df')) return 'sun'; if (s.includes('sam')||s.includes('sat')) return 'sat'; return 'week'; }
function dayLabel(sid){ const s = (sid||'').toLowerCase(); if (s.includes('dim')||s.includes('sun')||s.includes('df')) return 'Dim'; if (s.includes('sam')||s.includes('sat')) return 'Sam'; return 'Sem'; }
function dayClassOf(sid){
  const s = (sid||'').toLowerCase();
  if (s.includes('dim')||s.includes('sun')||s.includes('df')) return 'sun';
  if (s.includes('sam')||s.includes('sat')) return 'sat';
  return 'week';
}

function getZone(code){
  const c = code.toUpperCase();
  if (c.endsWith('X')) return 'express';
  if (c === 'ZO') return 'zoom';
  if (c.startsWith('T')) return 'aeroport';
  if (c.startsWith('E')) return 'est';
  if (c.startsWith('O')) return 'ouest';
  if (c.startsWith('S')) return 'sud';
  return 'nord';
}
function getZoneLabel(zone){
  return {express:'⚡ Express',nord:'🔵 Nord',sud:'🟢 Sud',ouest:'🟠 Ouest',
          est:'🔴 Est',aeroport:'🟣 Aéroport',zoom:'⚫ Zoom'}[zone] || zone;
}
function getZoneIcon(zone){
  return {express:'⚡',nord:'🔵',sud:'🟢',ouest:'🟠',est:'🔴',
          aeroport:'🟣',zoom:'⚫'}[zone] || '';
}
function getZoneDescription(zone){
  return {
    express: "Express — direct, moins d'arrêts",
    nord: 'Nord — secteur Saint-Denis',
    sud: 'Sud — secteur Saint-Pierre / Saint-Joseph',
    ouest: 'Ouest — secteur Saint-Paul',
    est: 'Est — secteur Saint-Benoît / Saint-André',
    aeroport: 'Aéroport — desserte Roland Garros',
    zoom: 'Zoom — express longue distance',
  }[zone] || zone;
}
function getLineDescription(code){
  const c = code.toUpperCase();
  const letters = {
    E: 'Est (Saint-Benoît / Saint-André)',
    O: 'Ouest (Saint-Paul)',
    S: 'Sud (Saint-Pierre / Saint-Joseph)',
    T: 'Aéroport / Touristique',
    ZO: "Zoom (ancien Z'éclair)",
  };
  const prefix = c.match(/^[A-Z]+/)?.[0] || '';
  let desc = letters[prefix] || 'Ligne interurbaine';
  if (c.endsWith('X')) desc += ' — EXPRESS';
  return desc;
}

async function load(){
  const main = document.getElementById('mainContent');
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.data = data;
    state.lines = (data.lines || []).sort((a,b)=>{
      const re = /^([A-Z]+)(\d*)(X?)$/;
      const ma = a.code.match(re), mb = b.code.match(re);
      if (ma && mb){
        if (ma[1] !== mb[1]) return ma[1].localeCompare(mb[1]);
        if (ma[2] !== mb[2]) return (parseInt(ma[2])||0) - (parseInt(mb[2])||0);
        return (ma[3]||'').localeCompare(mb[3]||'');
      }
      return a.code.localeCompare(b.code);
    });
    renderHeader();
    renderSidebar();
    if (state.lines.length) selectLine(state.lines[0].code);
  } catch(e){
    main.innerHTML = `<div class="err"><strong>❌ ${esc(e.message)}</strong><br><br>
      Lance : <code>python3 scripts/parse_car_jaune_full.py</code></div>`;
  }
}

function renderHeader(){
  const c = state.data.counts || {};
  document.getElementById('headerStats').innerHTML = `
    <span>📊 ${c.lines} lignes</span>
    <span>📍 ${c.stops} arrêts</span>
    <span>🚏 ${c.trips} trajets</span>
    <span>⏱️ ${(c.stop_times||0).toLocaleString('fr-FR')} passages</span>
  `;
}

function renderSidebar(){
  const list = document.getElementById('lineList');
  const q = normalize(state.lineSearch);
  const lines = state.lines.filter(l => !q || normalize(l.code + ' ' + l.name).includes(q));
  list.innerHTML = lines.map(l => {
    const zone = getZone(l.code);
    const icon = getZoneIcon(zone);
    return `
      <div class="line-btn ${l.code === state.selected ? 'active' : ''}"
           data-code="${esc(l.code)}"
           data-tooltip="${esc(getLineDescription(l.code))}">
        <span class="line-code">${esc(l.code)}</span>
        <span class="line-icon">${icon}</span>
        <span class="line-count">${l.trips_count}</span>
      </div>
    `;
  }).join('') || '<div style="padding:14px;text-align:center;color:var(--g500);font-size:11px">Aucune ligne</div>';
  list.querySelectorAll('.line-btn').forEach(el => {
    el.addEventListener('click', () => selectLine(el.dataset.code));
  });
}

function selectLine(code){
  state.selected = code;
  state.search = '';
  state.filterDay = 'all';
  state.filterDir = 'all';
  state.filterHour = 'all';
  state.sortKey = 'dep';
  state.sortDir = 'asc';
  state.page = 1;
  state.openTrips.clear();
  renderSidebar();
  renderMain();
}

function getFilteredTrips(line){
  let trips = line.departures.map(t => {
    const stops = t.stops || [];
    const dep = stops[0]?.dep || '';
    const arr = stops[stops.length-1]?.arr || '';
    return {
      ...t,
      _dep: dep,
      _arr: arr,
      _depStop: stops[0]?.stop || '',
      _arrStop: stops[stops.length-1]?.stop || '',
      _dur: duration(dep, arr),
      _nstops: stops.length,
      _day: dayClass(t.service_id),
      _dayLabel: dayLabel(t.service_id),
    };
  });

  if (state.filterDay !== 'all') trips = trips.filter(t => t._day === state.filterDay);
  if (state.filterDir !== 'all') trips = trips.filter(t => t.headsign === state.filterDir);
  if (state.filterHour !== 'all') {
    trips = trips.filter(t => {
      const h = parseInt((t._dep || '00:00').split(':')[0]);
      if (state.filterHour === 'morning') return h >= 5 && h < 12;
      if (state.filterHour === 'afternoon') return h >= 12 && h < 18;
      if (state.filterHour === 'evening') return h >= 18 && h < 24;
      return true;
    });
  }
  if (state.search){
    const q = normalize(state.search);
    trips = trips.filter(t => {
      const hay = normalize([t._depStop, t._arrStop, t.headsign, t._dep, t._arr].join(' '));
      return hay.includes(q);
    });
  }

  const key = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
  trips.sort((a,b) => {
    let va, vb;
    if (key === 'dep'){ va = parseHM(a._dep) ?? 9999; vb = parseHM(b._dep) ?? 9999; }
    else if (key === 'arr'){ va = parseHM(a._arr) ?? 9999; vb = parseHM(b._arr) ?? 9999; }
    else if (key === 'dur'){ va = a._dur ?? 9999; vb = b._dur ?? 9999; }
    else if (key === 'depStop'){ va = a._depStop; vb = b._depStop; }
    else if (key === 'arrStop'){ va = a._arrStop; vb = b._arrStop; }
    else if (key === 'headsign'){ va = a.headsign || ''; vb = b.headsign || ''; }
    else if (key === 'day'){ va = a._day; vb = b._day; }
    else if (key === 'nstops'){ va = a._nstops; vb = b._nstops; }
    else { va = a._dep; vb = b._dep; }
    if (typeof va === 'string') return va.localeCompare(vb) * dir;
    return (va - vb) * dir;
  });

  return trips;
}

function renderMain(){
  const main = document.getElementById('mainContent');
  const line = state.lines.find(l => l.code === state.selected);
  if (!line){ main.innerHTML = ''; return; }

  const trips = getFilteredTrips(line);
  const totalPages = Math.max(1, Math.ceil(trips.length / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * state.pageSize;
  const end = start + state.pageSize;
  const pageTrips = trips.slice(start, end);

  const dirs = [...new Set(line.departures.map(d => d.headsign).filter(Boolean))].sort();
  const dirsOpts = dirs.map(d =>
    `<option value="${esc(d)}" ${state.filterDir === d ? 'selected':''}>${esc(d)}</option>`
  ).join('');

  const rows = pageTrips.map((t, i) => {
    const stopRows = (t.stops || []).map((s, j) => {
      const isTerminus = j === t.stops.length - 1;
      const isDepart = j === 0;
      const rowClass = isTerminus ? 'terminus-row' : (isDepart ? 'depart-row' : '');
      return `
        <tr class="${rowClass}">
          <td class="n">${String(j+1).padStart(2,'0')}</td>
          <td class="s">${highlight(s.stop, state.search)}${isTerminus ? ' 🏁' : (isDepart ? ' 🚏' : '')}</td>
          <td class="a">${esc(formatHM(s.arr))}</td>
          <td class="d">${esc(formatHM(s.dep))}</td>
        </tr>
      `;
    }).join('');

    return `
      <tr class="hour-separator"><td colspan="9">🕐 ${formatHM(t._dep).slice(0,2)}:00 — ${esc(t._depStop)} → ${esc(t._arrStop)}</td></tr>
      <tr class="trip-block">
        <td colspan="9">
          <div class="trip-card">
            <div class="trip-head-mobile">
              <div class="trip-time">
                <span class="lbl">Départ</span>
                <strong>${esc(formatHM(t._dep))}</strong>
              </div>
              <div class="trip-route">
                <span class="stop">${highlight(t._depStop, state.search)}</span>
                <span class="arrow">→</span>
                <span class="stop">${highlight(t._arrStop, state.search)}</span>
              </div>
              <div class="trip-time arr">
                <span class="lbl">Arrivée</span>
                <strong>${esc(formatHM(t._arr))}</strong>
              </div>
              <div class="trip-meta">
                <span class="badge dur">${formatDuration(t._dur)}</span>
                <span class="badge day ${t._day}">${t._dayLabel}</span>
                <span class="badge stops">${t._nstops} arrêts</span>
              </div>
            </div>
            <table class="stops">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Arrêt</th>
                  <th style="text-align:right">Arrivée</th>
                  <th style="text-align:right">Départ</th>
                </tr>
              </thead>
              <tbody>${stopRows}</tbody>
            </table>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  let paginationHtml = '';
  if (totalPages > 1){
    const btn = (p, label, disabled) =>
      `<button data-page="${p}" ${disabled ? 'disabled' : ''}>${label}</button>`;
    const pageNums = [];
    const range = 2;
    for (let p = 1; p <= totalPages; p++){
      if (p === 1 || p === totalPages || (p >= state.page - range && p <= state.page + range)){
        pageNums.push(p);
      } else if (pageNums[pageNums.length-1] !== '...'){
        pageNums.push('...');
      }
    }
    paginationHtml = `
      <div class="pagination">
        ${btn(1, '⏮', state.page === 1)}
        ${btn(state.page - 1, '←', state.page === 1)}
        ${pageNums.map(p => p === '...'
          ? '<span class="info">…</span>'
          : `<button data-page="${p}" class="${p === state.page ? 'active' : ''}">${p}</button>`
        ).join('')}
        ${btn(state.page + 1, '→', state.page === totalPages)}
        ${btn(totalPages, '⏭', state.page === totalPages)}
        <span class="info">Page ${state.page} / ${totalPages}</span>
        <select class="size-sel" id="pageSize">
          <option value="25" ${state.pageSize===25?'selected':''}>25 / page</option>
          <option value="50" ${state.pageSize===50?'selected':''}>50 / page</option>
          <option value="100" ${state.pageSize===100?'selected':''}>100 / page</option>
          <option value="200" ${state.pageSize===200?'selected':''}>200 / page</option>
          <option value="9999" ${state.pageSize===9999?'selected':''}>Tout</option>
        </select>
      </div>
    `;
  }

  const zone = getZone(line.code);
  main.innerHTML = `
    <div class="line-header zone-${zone}">
      <div class="line-title">
        <span class="code">${esc(line.code)}</span>
        ${esc(line.name)}
        <span class="zone-badge zone-${zone}"
              data-tooltip="${esc(getZoneDescription(zone))}">${getZoneLabel(zone)}</span>
      </div>
      <div class="line-info">
        <span>🚏 ${line.trips_count} départs</span>
        <span>📍 ${line.stops_count} arrêts</span>
        <span>🧭 ${line.directions.length} directions</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Rechercher un arrêt, une ville, une direction…" value="${esc(state.search)}" autocomplete="off">
      </div>
      <select id="dayFilter">
        <option value="all" ${state.filterDay==='all'?'selected':''}>📅 Tous les jours</option>
        <option value="week" ${state.filterDay==='week'?'selected':''}>📅 Semaine</option>
        <option value="sat" ${state.filterDay==='sat'?'selected':''}>📅 Samedi</option>
        <option value="sun" ${state.filterDay==='sun'?'selected':''}>📅 Dimanche</option>
      </select>
      <select id="dirFilter">
        <option value="all" ${state.filterDir==='all'?'selected':''}>🧭 Toutes directions</option>
        ${dirsOpts}
      </select>
      <select id="hourFilter">
        <option value="all" ${state.filterHour==='all'?'selected':''}>🕐 Toute la journée</option>
        <option value="morning" ${state.filterHour==='morning'?'selected':''}>🌅 Matin (5-12h)</option>
        <option value="afternoon" ${state.filterHour==='afternoon'?'selected':''}>☀️ Après-midi (12-18h)</option>
        <option value="evening" ${state.filterHour==='evening'?'selected':''}>🌙 Soir (18-24h)</option>
      </select>
      <button class="btn primary" id="exportBtn">📥 Export CSV</button>
      <span class="count">${trips.length} / ${line.trips_count}</span>
    </div>

    <div class="trips-list">
      ${rows || '<div class="loading">Aucun départ pour ces filtres</div>'}
    </div>

    ${paginationHtml}

    <div class="hint">
      💡 <span class="kbd">/</span> rechercher · <span class="kbd">←</span> <span class="kbd">→</span> paginer · Clic sur en-tête pour trier
    </div>
  `;

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value; state.page = 1; renderMain();
  });
  document.getElementById('dayFilter').addEventListener('change', e => {
    state.filterDay = e.target.value; state.page = 1; renderMain();
  });
  document.getElementById('dirFilter').addEventListener('change', e => {
    state.filterDir = e.target.value; state.page = 1; renderMain();
  });
  document.getElementById('hourFilter').addEventListener('change', e => {
    state.filterHour = e.target.value; state.page = 1; renderMain();
  });
  document.getElementById('exportBtn').addEventListener('click', () => exportCsv(line, trips));

  main.querySelectorAll('.pagination button[data-page]').forEach(b => {
    b.addEventListener('click', () => {
      const p = parseInt(b.dataset.page);
      if (p >= 1 && p <= totalPages){ state.page = p; renderMain(); }
    });
  });
  const sizeSel = document.getElementById('pageSize');
  if (sizeSel) sizeSel.addEventListener('change', e => {
    state.pageSize = parseInt(e.target.value);
    state.page = 1;
    renderMain();
  });
}

function exportCsv(line, trips){
  const cols = ['ligne','depart','arret_depart','terminus','arrivee','duree','direction','jour','nb_arrets','arrets_details'];
  const rows = [cols.join(',')];
  for (const t of trips){
    const details = (t.stops || []).map(s => `${s.stop}(${s.arr||''}-${s.dep||''})`).join(' | ');
    rows.push([
      line.code,
      `"${t._dep}"`,
      `"${(t._depStop||'').replace(/"/g,'""')}"`,
      `"${(t._arrStop||'').replace(/"/g,'""')}"`,
      `"${t._arr}"`,
      `"${formatDuration(t._dur)}"`,
      `"${(t.headsign||'').replace(/"/g,'""')}"`,
      `"${t._dayLabel}"`,
      t._nstops,
      `"${details.replace(/"/g,'""')}"`,
    ].join(','));
  }
  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `car-jaune-${line.code}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('lineSearch').addEventListener('input', e => {
  state.lineSearch = e.target.value;
  renderSidebar();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === '/'){ e.preventDefault(); document.getElementById('searchInput')?.focus(); }
  if (e.key === 'ArrowLeft' && state.page > 1){ state.page--; renderMain(); }
  if (e.key === 'ArrowRight'){ state.page++; renderMain(); }
  if (e.key === 'Escape'){ state.search = ''; renderMain(); }
});

// ═══════════════════════════════════════════════════════════
// 🎯 SMART MODULE — GPS + Prochain car + Itinéraire + Carte
// ═══════════════════════════════════════════════════════════

const Smart = {
  userPos: null,
  nearbyStops: [],
  favorites: JSON.parse(localStorage.getItem('carjaune:fav') || '[]'),
  notifsEnabled: false,
  map: null,

  haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  },

  locate(){
    const status = document.getElementById('smartStatus');
    const btn = document.getElementById('btnLocate');
    status.textContent = '📍 Localisation…';
    btn.disabled = true;

    if (!navigator.geolocation){
      status.textContent = '❌ GPS non supporté';
      btn.disabled = false;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      pos => {
        this.userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        const acc = Math.round(pos.coords.accuracy);
        status.textContent = `✓ Position (±${acc} m)`;
        btn.classList.add('active');
        btn.disabled = false;
        this.findNearbyStops();
        this.showNextCars();
        this.showNotifPrompt();
      },
      err => {
        status.textContent = `❌ ${err.message}`;
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  },

  findNearbyStops(){
    if (!this.userPos || !state.data?.stops_index) return;
    const { lat, lon } = this.userPos;
    const results = [];
    for (const s of state.data.stops_index){
      const d = this.haversine(lat, lon, s.lat, s.lon);
      if (d <= 1000) results.push({ ...s, distance: Math.round(d) });
    }
    results.sort((a, b) => a.distance - b.distance);
    this.nearbyStops = results.slice(0, 8);
  },

  getNextDepartures(stopName){
    if (!state.data?.lines) return [];
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const dow = now.getDay();
    const todayClass = dow === 0 ? 'sun' : (dow === 6 ? 'sat' : 'week');

    const results = [];
    for (const line of state.data.lines){
      for (const dep of line.departures){
        const dClass = dayClassOf(dep.service_id);
        if (dClass !== todayClass) continue;

        const idx = dep.stops.findIndex(s => s.stop === stopName);
        if (idx === -1) continue;

        const depTime = dep.stops[idx].dep;
        const hm = parseHM(depTime);
        if (hm == null) continue;

        let wait = hm - nowMin;
        if (wait < 0) wait += 1440;
        if (wait > 240) continue;

        results.push({
          line: line.code,
          lineName: line.name,
          headsign: dep.headsign,
          stop: stopName,
          time: depTime,
          wait: wait,
          tripId: dep.trip_id,
          stopsLeft: dep.stops.length - idx - 1,
          arrTime: dep.stops[dep.stops.length-1].arr,
        });
      }
    }
    results.sort((a, b) => a.wait - b.wait);
    return results.slice(0, 10);
  },

  showNextCars(){
    const el = document.getElementById('smartResults');
    el.style.display = 'block';

    if (!this.userPos){
      el.innerHTML = `
        <div class="smart-results-head">
          <h3>📍 Activez la géolocalisation</h3>
          <button class="close" onclick="document.getElementById('smartResults').style.display='none'">✕</button>
        </div>
        <div class="smart-results-body">
          <p style="font-size:13px;color:var(--g700);padding:14px 18px;line-height:1.7">
            Cliquez sur <strong>📍 Ma position</strong> pour voir les prochains cars autour de vous.
          </p>
        </div>`;
      return;
    }

    if (!this.nearbyStops.length){
      el.innerHTML = `
        <div class="smart-results-head">
          <h3>😕 Aucun arrêt à proximité</h3>
          <button class="close" onclick="document.getElementById('smartResults').style.display='none'">✕</button>
        </div>
        <div class="smart-results-body">
          <p style="font-size:13px;color:var(--g700);padding:14px 18px">
            Aucun arrêt Car Jaune dans un rayon de 1 km.
          </p>
        </div>`;
      return;
    }

    const closest = this.nearbyStops[0];
    const next = this.getNextDepartures(closest.name);

    let html = `
      <div class="smart-results-head">
        <h3>🎯 Prochain car à <strong>${esc(closest.name)}</strong></h3>
        <span class="dist">à ${closest.distance} m</span>
        <button class="close" onclick="document.getElementById('smartResults').style.display='none'">✕</button>
      </div>
      <div class="smart-results-body">`;

    if (!next.length){
      html += `<p style="font-size:13px;color:var(--g500);padding:14px 18px">
        Aucun car dans les 4 prochaines heures.</p>`;
    } else {
      html += next.map(n => {
        const wClass = n.wait <= 5 ? 'very-soon' : (n.wait <= 15 ? 'soon' : '');
        const waitLabel = n.wait === 0 ? 'maintenant'
                       : n.wait < 60 ? `dans ${n.wait} min`
                       : `dans ${Math.floor(n.wait/60)}h${String(n.wait%60).padStart(2,'0')}`;
        return `
          <div class="next-car" onclick="Smart.selectLine('${esc(n.line)}')">
            <div class="code">${esc(n.line)}</div>
            <div class="route">
              → ${esc(n.headsign || '—')}
              <small>${esc(n.time)} · ${n.stopsLeft} arrêts restants · arrivée ${esc(n.arrTime)}</small>
            </div>
            <div class="time ${wClass}">${esc(n.time)}</div>
            <div class="wait ${wClass}">${waitLabel}</div>
          </div>`;
      }).join('');
    }
    html += `</div>`;

    if (this.nearbyStops.length > 1){
      html += `
        <details class="smart-extra">
          <summary>📍 Voir les ${this.nearbyStops.length - 1} autres arrêts proches</summary>
          <div style="padding:8px 0">
            ${this.nearbyStops.slice(1).map(s => `
              <div class="stop-row" onclick="Smart.showNextCarsFor('${esc(s.name)}')">
                <span class="name">${esc(s.name)}</span>
                <span class="meta">${s.distance} m · ${s.lines.join(', ')}</span>
              </div>
            `).join('')}
          </div>
        </details>`;
    }

    el.innerHTML = html;
  },

  showNextCarsFor(stopName){
    const el = document.getElementById('smartResults');
    const next = this.getNextDepartures(stopName);
    const stop = this.nearbyStops.find(s => s.name === stopName);

    let html = `
      <div class="smart-results-head">
        <h3>🎯 Prochain car à <strong>${esc(stopName)}</strong></h3>
        <span class="dist">à ${stop?.distance || '?'} m</span>
        <button class="close" onclick="document.getElementById('smartResults').style.display='none'">✕</button>
      </div>
      <div class="smart-results-body">`;

    if (!next.length){
      html += `<p style="font-size:13px;color:var(--g500);padding:14px 18px">
        Aucun car dans les 4 prochaines heures.</p>`;
    } else {
      html += next.map(n => {
        const wClass = n.wait <= 5 ? 'very-soon' : (n.wait <= 15 ? 'soon' : '');
        const waitLabel = n.wait === 0 ? 'maintenant'
                       : n.wait < 60 ? `dans ${n.wait} min`
                       : `dans ${Math.floor(n.wait/60)}h${String(n.wait%60).padStart(2,'0')}`;
        return `
          <div class="next-car" onclick="Smart.selectLine('${esc(n.line)}')">
            <div class="code">${esc(n.line)}</div>
            <div class="route">
              → ${esc(n.headsign || '—')}
              <small>${esc(n.time)} · ${n.stopsLeft} arrêts · arrivée ${esc(n.arrTime)}</small>
            </div>
            <div class="time ${wClass}">${esc(n.time)}</div>
            <div class="wait ${wClass}">${waitLabel}</div>
          </div>`;
      }).join('');
    }
    html += `</div>`;
    el.innerHTML = html;
  },

  showMap(){
    const el = document.getElementById('smartResults');
    el.style.display = 'block';

    el.innerHTML = `
      <div class="smart-results-head">
        <h3>🗺️ Carte du réseau Car Jaune</h3>
        <button class="close" onclick="document.getElementById('smartResults').style.display='none'">✕</button>
      </div>
      <div style="padding:14px 18px">
        <div id="map"></div>
      </div>`;

    setTimeout(() => this.initMap(), 100);
  },

  initMap(){
    if (this.map){ this.map.remove(); this.map = null; }

    const center = this.userPos
      ? [this.userPos.lat, this.userPos.lon]
      : [-21.115, 55.536];

    this.map = L.map('map').setView(center, this.userPos ? 14 : 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18,
    }).addTo(this.map);

    if (this.userPos){
      L.circleMarker([this.userPos.lat, this.userPos.lon], {
        radius: 8, color: '#0055a4', fillColor: '#0077dd',
        fillOpacity: 1, weight: 3,
      }).addTo(this.map).bindPopup('<strong>📍 Vous êtes ici</strong>');
    }

    if (this.nearbyStops.length){
      for (const s of this.nearbyStops){
        const isClosest = s === this.nearbyStops[0];
        L.circleMarker([s.lat, s.lon], {
          radius: isClosest ? 7 : 5,
          color: isClosest ? '#00a95f' : '#0055a4',
          fillColor: isClosest ? '#00a95f' : '#0077dd',
          fillOpacity: 0.9,
          weight: 2,
        }).addTo(this.map).bindPopup(
          `<strong>${esc(s.name)}</strong><br>📏 ${s.distance} m<br>🚌 ${s.lines.join(', ')}`
        );
      }
    }
  },

  showItinerary(){
    const el = document.getElementById('smartResults');
    el.style.display = 'block';

    el.innerHTML = `
      <div class="smart-results-head">
        <h3>🗺️ Calculer un itinéraire</h3>
        <button class="close" onclick="document.getElementById('smartResults').style.display='none'">✕</button>
      </div>
      <div class="itinerary-form">
        <input type="text" id="itinFrom" placeholder="Départ (ex: St-Benoît)" value="${this.nearbyStops[0]?.name || ''}">
        <input type="text" id="itinTo" placeholder="Arrivée (ex: St-Denis)">
        <button onclick="Smart.computeItinerary()">🔍 Chercher</button>
      </div>
      <div id="itinResult"></div>`;
  },

  computeItinerary(){
    const from = document.getElementById('itinFrom').value.trim();
    const to = document.getElementById('itinTo').value.trim();
    const result = document.getElementById('itinResult');

    if (!from || !to){
      result.innerHTML = '<div class="itinerary-result" style="color:var(--red)">❌ Remplissez les deux champs</div>';
      return;
    }

    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const dow = now.getDay();
    const todayClass = dow === 0 ? 'sun' : (dow === 6 ? 'sat' : 'week');

    const routes = [];
    for (const line of state.data.lines){
      for (const dep of line.departures){
        const dClass = dayClassOf(dep.service_id);
        if (dClass !== todayClass) continue;

        const idxFrom = dep.stops.findIndex(s => normalize(s.stop).includes(normalize(from)));
        const idxTo = dep.stops.findIndex(s => normalize(s.stop).includes(normalize(to)));
        if (idxFrom === -1 || idxTo === -1) continue;
        if (idxFrom >= idxTo) continue;

        const depTime = dep.stops[idxFrom].dep;
        const arrTime = dep.stops[idxTo].arr;
        const hm = parseHM(depTime);
        if (hm == null) continue;

        let wait = hm - nowMin;
        if (wait < 0) wait += 1440;
        if (wait > 240) continue;

        routes.push({
          line: line.code,
          headsign: dep.headsign,
          from: dep.stops[idxFrom].stop,
          to: dep.stops[idxTo].stop,
          depTime, arrTime, wait,
          dur: duration(depTime, arrTime),
          stops: idxTo - idxFrom,
        });
      }
    }

    routes.sort((a, b) => a.wait - b.wait);

    if (!routes.length){
      result.innerHTML = `<div class="itinerary-result" style="color:var(--red)">
        ❌ Aucun trajet direct trouvé de <strong>${esc(from)}</strong> à <strong>${esc(to)}</strong> dans les 4 prochaines heures.
      </div>`;
      return;
    }

    const best = routes[0];
    result.innerHTML = `
      <div class="itinerary-result">
        <div class="step"><span class="icon">🚏</span>
          <span class="txt">Départ de <strong>${esc(best.from)}</strong> à <strong>${esc(best.depTime)}</strong></span>
        </div>
        <div class="step"><span class="icon">🚌</span>
          <span class="txt">Prendre la ligne <strong>${esc(best.line)}</strong> direction <strong>${esc(best.headsign)}</strong></span>
        </div>
        <div class="step"><span class="icon">⏱️</span>
          <span class="txt">${best.stops} arrêts · durée <strong>${formatDuration(best.dur)}</strong></span>
        </div>
        <div class="step"><span class="icon">🏁</span>
          <span class="txt">Arrivée à <strong>${esc(best.to)}</strong> à <strong>${esc(best.arrTime)}</strong></span>
        </div>
        <div style="margin-top:10px;padding:10px;background:var(--green-soft);
                    border-radius:6px;font-size:12px;color:var(--green);font-weight:700">
          💡 Prochain car dans ${best.wait} min
        </div>
      </div>`;
  },

  showNotifPrompt(){
    if (this.notifsEnabled || !('Notification' in window)) return;
    if (Notification.permission === 'granted'){ this.notifsEnabled = true; return; }
    if (Notification.permission === 'denied') return;
    document.getElementById('notifPrompt').classList.add('show');
  },

  enableNotifs(){
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(perm => {
      if (perm === 'granted'){
        this.notifsEnabled = true;
        new Notification('🚌 Car Jaune 974', {
          body: 'Notifications activées ! Vous serez prévenu 5 min avant votre car.',
        });
      }
      document.getElementById('notifPrompt').classList.remove('show');
    });
  },

  selectLine(code){
    selectLine(code);
    document.getElementById('smartResults').style.display = 'none';
  },
};

document.getElementById('btnLocate')?.addEventListener('click', () => Smart.locate());
document.getElementById('btnNext')?.addEventListener('click', () => {
  if (!Smart.userPos) Smart.locate();
  else Smart.showNextCars();
});
document.getElementById('btnItinerary')?.addEventListener('click', () => Smart.showItinerary());
document.getElementById('btnMap')?.addEventListener('click', () => {
  if (!Smart.userPos) { Smart.locate(); setTimeout(() => Smart.showMap(), 1500); }
  else Smart.showMap();
});

setTimeout(() => {
  if (navigator.geolocation && !Smart.userPos){
    const status = document.getElementById('smartStatus');
    if (status) status.textContent = '💡 Cliquez sur 📍 Ma position';
  }
}, 800);

load();
</script>
